name: AdaCore
description: >-
  AdaCore is a software company with more than 30 years of experience building
  compilation, static and dynamic analysis, and formal-verification toolchains
  for reliable, safe, and secure software in safety- and mission-critical
  systems. Its product line includes GNAT Pro (Ada, C/C++, and Rust
  compilation), SPARK Pro (formal proof), GNAT Static Analysis, CodeSonar for
  C/C++, the GNAT Dynamic Analysis Suite, and the GNAT Studio IDE together with
  the open-source Ada Language Server and VS Code extension. AdaCore tooling is
  used across aerospace, defense, rail, automotive, energy, telecommunications,
  finance, and medical-device industries. AdaCore is a compiler and toolchain
  vendor and does not publish a hosted REST API or API client SDKs; this
  API Evangelist profile catalogs its developer tooling, packages, and public
  developer resources. It was surfaced as a portfolio company of Battery
  Ventures.
